{% extends "base.html" %}

{% block title %}Удаление записи{% endblock %}

{% block content %}

<div class="mb-3">
    <a href="{% url 'project_detail' project.id %}" class="btn btn-outline-secondary btn-sm">
        ← Назад к проекту
    </a>
</div>

<div class="card shadow-sm border-danger">
    <div class="card-header bg-danger text-white">
        <strong>Подтверждение удаления</strong>
    </div>

    <div class="card-body">
        <p class="mb-3">
            Вы действительно хотите удалить запись?
        </p>

        <div class="alert alert-warning">
            <strong>{{ object_name }}</strong>
        </div>

        <form method="post">
            {% csrf_token %}

            <button type="submit" class="btn btn-danger">
                Удалить
            </button>

            <a href="{% url 'project_detail' project.id %}" class="btn btn-outline-secondary">
                Отмена
            </a>
        </form>
    </div>
</div>

{% endblock %}
